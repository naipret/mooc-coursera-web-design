<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0" />
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body onload="addTabFocus()">
    <header>
      <h1>Accessible Interactive Photo Gallery</h1>
    </header>
    <main>
      <div id="image">Hover over an image below to display here.</div>
      <img
        class="preview"
        alt="Festive entrance gate and traditional curved roof of Khanh Linh Pagoda under a clear sky"
        src="images/pagoda.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Several green and brown iguanas resting together on grass near a tree"
        src="images/zoo.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Low-angle upward view of a multi-story pastel yellow dormitory building under an open sky"
        src="images/training.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Outdoor cafe seating area featuring a vintage bus converted into a coffee kiosk beside trees"
        src="images/coffee.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Independence Palace facade with red flags fluttering along the courtyard lawn on a sunny day"
        src="images/event.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Two young ginger and white kittens sitting attentively on a concrete ledge in front of green leaves"
        src="images/cat.jpg"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
    </main>
    <script src="js/gallery.js"></script>
  </body>
</html>
