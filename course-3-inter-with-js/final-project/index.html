<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0" />
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body onload="addTabFocus()">
    <header>
      <h1>Accessible Interactive Photo Gallery</h1>
    </header>
    <main>
      <div id="image">Hover over an image below to display here.</div>
      <img
        class="preview"
        alt="Khanh Linh Pagoda Gate"
        src="images/pagoda.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        alt="Military Academy Building"
        src="images/training.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        alt="Independence Palace Courtyard"
        src="images/event.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Two Ginger Kittens"
        src="images/cat.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Iguanas Resting in Grass"
        src="images/zoo.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
      <img
        class="preview"
        alt="Vintage Coffee Bus"
        src="images/coffee.jpg"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
    </main>
    <script src="js/gallery.js"></script>
  </body>
</html>
